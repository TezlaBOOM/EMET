services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: agenthub-app:latest
    container_name: agenthub-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - agenthub-instances:/var/lib/agenthub/instances
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-agenthub}
      - DB_USERNAME=${DB_USERNAME:-agenthub}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agenthub-net

  db:
    image: pgvector/pgvector:pg16
    container_name: agenthub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-agenthub}
      POSTGRES_USER: ${DB_USERNAME:-agenthub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - agenthub-db-data:/var/lib/postgresql/data
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-agenthub} -d ${DB_DATABASE:-agenthub}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agenthub-net

  redis:
    image: redis:7-alpine
    container_name: agenthub-redis
    restart: unless-stopped
    volumes:
      - agenthub-redis-data:/data
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agenthub-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agenthub-qdrant
    restart: unless-stopped
    volumes:
      - agenthub-qdrant-data:/qdrant/storage
    ports:
      - "${FORWARD_QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agenthub-net

  reverb:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: agenthub-reverb
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "${REVERB_PORT:-8080}:8080"
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      - app
      - redis
    networks:
      - agenthub-net

networks:
  agenthub-net:
    driver: bridge

volumes:
  agenthub-db-data:
  agenthub-redis-data:
  agenthub-qdrant-data:
  agenthub-instances:
